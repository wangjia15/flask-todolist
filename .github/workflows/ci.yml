name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Set up UV
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Install dependencies
      run: |
        uv sync --dev

    - name: Run Ruff linting
      run: |
        uv run ruff check . --output-format=github

    - name: Run Ruff formatting check
      run: |
        uv run ruff format --check .

    - name: Run type checking (if needed)
      run: |
        uv run python -m py_compile app.py todo_manager.py

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Set up UV
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Install dependencies
      run: |
        uv sync --dev

    - name: Run Bandit security scan
      run: |
        pip install bandit[toml]
        bandit -r . -f json -o bandit-report.json || true
        bandit -r . || true

    - name: Upload security scan results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-scan-results
        path: bandit-report.json
        retention-days: 30

  test:
    name: Application Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Set up UV
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Install dependencies
      run: |
        uv sync --dev

    - name: Test application startup
      run: |
        timeout 10s uv run python app.py || true

    - name: Test TodoManager functionality
      run: |
        uv run python -c "
        from todo_manager import TodoManager
        import tempfile
        import os

        # 使用临时文件进行测试
        with tempfile.NamedTemporaryFile(mode='w', suffix='.json', delete=False) as f:
            temp_file = f.name

        try:
            tm = TodoManager(temp_file)

            # 测试添加任务
            todo = tm.add_todo('Test task', 'Test description')
            assert todo['title'] == 'Test task'
            assert todo['completed'] == False

            # 测试获取任务
            todos = tm.get_all_todos()
            assert len(todos) == 1

            # 测试更新任务
            updated = tm.update_todo(todo['id'], completed=True)
            assert updated['completed'] == True

            # 测试删除任务
            deleted = tm.delete_todo(todo['id'])
            assert deleted == True

            todos = tm.get_all_todos()
            assert len(todos) == 0

            print('✅ TodoManager tests passed!')
        finally:
            os.unlink(temp_file)
        "

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [code-quality, security-scan, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Production
      run: |
        echo "🚀 Deployment completed successfully!"
        echo "This is where you would add your actual deployment logic"
        echo "For example: deploy to Vercel, Heroku, AWS, etc."

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        release_name: Release v${{ github.run_number }}
        body: |
          🎉 Flask TodoList Application v${{ github.run_number }}

          ## Changes in this release:
          - Automated code quality checks with Ruff
          - Security scanning with Bandit
          - Automated testing
          - CI/CD pipeline setup

          ## Features:
          - ✅ Task management (Create, Read, Update, Delete)
          - 💾 JSON file storage
          - 🎨 Responsive web interface
          - 📊 Task statistics
          - 🔧 RESTful API

          ## Installation:
          ```bash
          git clone https://github.com/wangjia15/flask-todolist.git
          cd flask-todolist
          uv install
          uv run python app.py
          ```
        draft: false
        prerelease: false
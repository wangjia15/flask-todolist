name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  ruff:
    name: Ruff - Python Linting and Formatting
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Set up UV
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Install dependencies
      run: |
        uv sync --dev

    - name: Run Ruff linter
      run: |
        uv run ruff check . --output-format=github

    - name: Run Ruff formatter check
      run: |
        uv run ruff format --check .

    - name: Auto-fix with Ruff (if needed)
      if: failure()
      run: |
        uv run ruff check . --fix
        uv run ruff format .
        echo "⚠️ Ruff made automatic fixes. Please review and commit the changes."

  python-syntax:
    name: Python Syntax Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Set up UV
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Install dependencies
      run: |
        uv sync --dev

    - name: Check Python syntax
      run: |
        find . -name "*.py" -not -path "./.venv/*" -not -path "./venv/*" | xargs python -m py_compile
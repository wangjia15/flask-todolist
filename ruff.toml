# 目标 Python 版本
target-version = "py312"

# 行长度限制
line-length = 88

# 包含的文件路径
include = ["*.py", "pyproject.toml"]

# 排除的路径
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    "__pycache__",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    ".venv",
]

# 启用的规则
[lint]
# 选择要启用的规则集
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # flake8-comprehensions
    "C4",
]

# 忽略的规则
ignore = [
    # D103 - Missing docstring in public function
    "D103",
    # D101 - Missing docstring in public class
    "D101",
    # D107 - Missing docstring in `__init__`
    "D107",
    # D415 - First line should end with a period, question mark, or exclamation point
    "D415",
]

# flake8-docstrings 配置
[lint.pydocstyle]
convention = "google"

# isort 配置
[lint.isort]
known-first-party = ["todo_manager", "app"]

# 格式化配置
[format]
# 使用双引号
quote-style = "double"
# 缩进样式
indent-style = "space"
# 行尾样式
line-ending = "auto"

# Flake8 规则配置
[lint.flake8-quotes]
docstring-quotes = "double"

[lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true

# PyUpgrade 配置
[lint.pyupgrade]
# 保留 Python 3.8+ 兼容性
keep-runtime-typing = true